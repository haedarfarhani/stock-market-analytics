<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23DB2777'/%3E%3Cpath d='M7 21l5-6 4 3 5-8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='10' r='2' fill='white'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="پلتفرم تحلیل بازار سرمایه ایران — بورس تهران، فرابورس، کالا، طلا و ارز، صندوق‌ها، آپشن و کدال" />
    <title>تحلیل بازار سرمایه ایران | داشبورد بورس تهران</title>
    <script>
      // Apply theme before paint to avoid FOUC.
      // Saved choice wins; otherwise respect the OS preference.
      try {
        var t = localStorage.getItem('isa-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t !== 'light');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
