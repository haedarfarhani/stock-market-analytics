# Deploy the Vite production build to GitHub Pages.
#
# Setup (one time):
#   1. Push this repo to GitHub.
#   2. Repo Settings -> Pages -> Source: "GitHub Actions".
#   3. If this is a PROJECT site (https://USER.github.io/REPO/):
#      Repo Settings -> Secrets and variables -> Actions -> Variables ->
#      New variable  VITE_BASE_PATH = /REPO/
#      (For a USER/ORGANIZATION site keep the default "/".)
#   4. Push to master (or run manually) — the site URL appears in the deploy step.
#
# Notes:
#   - Secrets are NOT needed: the build uses no API key (VITE_BRSAPI_KEY stays
#     empty, so the deployed site runs on labeled mock data + any cache).
#   - dist/index.html is copied to dist/404.html so Vue Router deep links
#     (e.g. /stocks/فولاد) resolve on Pages.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      # Live data on the public site. WARNING: Vite inlines this into the
      # client JS bundle, so anyone can read it via DevTools. Only use a key
      # whose quota you can afford to expose; for real protection put a
      # backend proxy in front and keep the key server-side instead.
      VITE_BRSAPI_KEY: ${{ secrets.VITE_BRSAPI_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # NOTE: intentionally `npm install`, not `npm ci`. The lockfile is
        # generated on Windows, where npm prunes other platforms' optional
        # dependencies — including Vite 8 / rolldown's Linux native binding
        # (@rolldown/binding-linux-x64-gnu). `npm ci` installs the lock
        # verbatim and the build then crashes with "Cannot find native
        # binding" (npm/cli#4828). `npm install` re-resolves optionals for
        # the runner's platform and installs the correct binding.
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
